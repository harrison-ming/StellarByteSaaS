name: Deploy to 107 (DECOMMISSIONED)

on:
  workflow_dispatch:

jobs:
  deploy:
    # Production was decommissioned on 2026-09-08. Keep this guard in the
    # repository so re-enabling the workflow cannot redeploy it accidentally.
    if: ${{ false }}
    name: Deploy StellarByte to 107 Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /Users/ming/Documents/host/StellarByte
            bash deploy-to-107.sh
