---
# StellarByte image build (docs/redeploy-spec.md D6, 3.5, 4).
# Contabo only pulls this image; it never builds.
name: "Build StellarByte image"

on:
  push:
    tags:
      - 'stellarbyte-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to the ref name)'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-stellarbyte-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/harrison-ming/stellarbyte-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Brand check (rule hit counts, residual / honesty / colour scans)
        run: node scripts/brand/apply-brand.mjs --check

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME//\//-}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          pull: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.licenses=AGPL-3.0
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest-amd64

      - name: Image digest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"
